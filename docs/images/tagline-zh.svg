<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBA6F7"/>
      <stop offset="50%" stop-color="#89B4FA"/>
      <stop offset="100%" stop-color="#F5C2E7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.7" fill="#45475A" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="130" fill="#0e050f" opacity="0.3"/>
  <rect width="900" height="130" fill="url(#dots)"/>

  <!-- Animated underline glow bar -->
  <rect x="240" y="88" width="0" height="2" rx="1" fill="url(#textGrad)" opacity="0.8">
    <animate attributeName="width" from="0" to="420" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>

  <!-- Corner brackets -->
  <g opacity="0" filter="url(#glow)">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.8s" begin="1.5s" fill="freeze"/>
    <path d="M50 25 L50 15 L60 15" fill="none" stroke="#CBA6F7" stroke-width="1.5"/>
    <path d="M850 25 L850 15 L840 15" fill="none" stroke="#CBA6F7" stroke-width="1.5"/>
    <path d="M850 105 L850 115 L840 115" fill="none" stroke="#CBA6F7" stroke-width="1.5"/>
    <path d="M50 105 L50 115 L60 115" fill="none" stroke="#CBA6F7" stroke-width="1.5"/>
  </g>

  <!-- Main tagline text — CN -->
  <text x="450" y="62" text-anchor="middle" fill="#CDD6F4" font-family="Microsoft YaHei, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="2" filter="url(#glow)">
    <tspan fill="url(#textGrad)">轻量</tspan>
    <tspan fill="#6C7086"> · </tspan>
    <tspan fill="url(#textGrad)">快速</tspan>
    <tspan fill="#6C7086"> · </tspan>
    <tspan fill="url(#textGrad)">单文件</tspan>
  </text>

  <!-- Sub tagline — CN -->
  <text x="450" y="108" text-anchor="middle" fill="#585B70" font-family="Microsoft YaHei, Segoe UI, system-ui, sans-serif" font-size="13">
    一个微型 Windows 窗口管理器 — AutoHotkey v2 驱动
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Accent dots -->
  <circle cx="210" cy="58" r="2" fill="#CBA6F7" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="58" r="2" fill="#89B4FA" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>