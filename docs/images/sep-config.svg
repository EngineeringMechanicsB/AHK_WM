<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e050f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1E1E2E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0e050f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="csr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBA6F7"/><stop offset="100%" stop-color="#89B4FA"/>
    </linearGradient>
  </defs>
  <rect width="900" height="120" fill="url(#bg)"/>
  <!-- Code line reveals -->
  <line x1="80" y1="60" x2="820" y2="60" stroke="#45475A" stroke-width="0.5" opacity="0.3"/>
  <!-- Fake code snippet -->
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11" opacity="0.5">
    <text x="180" y="48" fill="#CBA6F7">[Bar]</text>
    <text x="230" y="48" fill="#89B4FA">Height</text>
    <text x="295" y="48" fill="#A6ADC8">=</text>
    <text x="310" y="48" fill="#A6E3A1">38</text>
    <text x="370" y="48" fill="#585B70">;</text>
    <text x="385" y="48" fill="#89B4FA">FontSize</text>
    <text x="465" y="48" fill="#A6ADC8">=</text>
    <text x="480" y="48" fill="#A6E3A1">12</text>
    <!-- Blinking cursor -->
    <rect x="508" y="36" width="1.5" height="14" fill="url(#csr)">
      <animate attributeName="opacity" values="1;1;0;0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <text x="180" y="68" fill="#CBA6F7">[Theme]</text>
    <text x="250" y="68" fill="#89B4FA">Bg</text>
    <text x="272" y="68" fill="#A6ADC8">=</text>
    <text x="285" y="68" fill="#A6E3A1">0e050f</text>
    <text x="370" y="68" fill="#585B70">;</text>
    <text x="385" y="68" fill="#89B4FA">Ac</text>
    <text x="410" y="68" fill="#A6ADC8">=</text>
    <text x="423" y="68" fill="#A6E3A1">744da9</text>
  </g>
  <!-- Fade-in reveal -->
  <rect x="0" y="0" width="900" height="120" fill="#0e050f">
    <animate attributeName="opacity" from="1" to="0" dur="1s" begin="0.3s" fill="freeze"/>
  </rect>
</svg>