<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e050f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1E1E2E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e050f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#CBA6F7"/><stop offset="100%" stop-color="#89B4FA"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F38BA8"/><stop offset="100%" stop-color="#FAB387"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A6E3A1"/><stop offset="100%" stop-color="#89B4FA"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAB387"/><stop offset="100%" stop-color="#F5C2E7"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/></filter>
    <filter id="gl"><feGaussianBlur stdDeviation="1"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="countGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBA6F7"/><stop offset="100%" stop-color="#A6E3A1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="150" fill="url(#bg)"/>
  <line x1="60" y1="75" x2="940" y2="75" stroke="#45475A" stroke-width="0.5" opacity="0.25"/>

  <!-- Win 1: top-left scattered → TL grid -->
  <g filter="url(#sh)">
    <animateTransform attributeName="transform" type="translate"
      values="-120 -25; -120 -25; 0 0; 0 0; 0 0"
      keyTimes="0; 0.15; 0.55; 0.85; 1"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <rect x="60" y="25" width="190" height="50" rx="5" fill="#1E1E2E"/>
    <rect x="60" y="25" width="190" height="50" rx="5" fill="none" stroke="url(#g1)" stroke-width="1.5"/>
    <rect x="60" y="25" width="190" height="16" rx="5" fill="#313244" opacity="0.6"/>
    <rect x="76" y="44" width="80" height="5" rx="2" fill="#45475A" opacity="0.5"/>
    <rect x="76" y="53" width="120" height="5" rx="2" fill="#45475A" opacity="0.3"/>
  </g>

  <!-- Win 2 -->
  <g filter="url(#sh)">
    <animateTransform attributeName="transform" type="translate"
      values="140 -35; 140 -35; 0 0; 0 0; 0 0"
      keyTimes="0; 0.18; 0.58; 0.88; 1"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <rect x="280" y="25" width="190" height="50" rx="5" fill="#1E1E2E"/>
    <rect x="280" y="25" width="190" height="50" rx="5" fill="none" stroke="url(#g2)" stroke-width="1.5"/>
    <rect x="280" y="25" width="190" height="16" rx="5" fill="#313244" opacity="0.6"/>
    <rect x="296" y="44" width="60" height="5" rx="2" fill="#45475A" opacity="0.5"/>
    <rect x="296" y="53" width="100" height="5" rx="2" fill="#45475A" opacity="0.3"/>
  </g>

  <!-- Win 3 -->
  <g filter="url(#sh)">
    <animateTransform attributeName="transform" type="translate"
      values="-100 45; -100 45; 0 0; 0 0; 0 0"
      keyTimes="0; 0.12; 0.52; 0.82; 1"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <rect x="500" y="25" width="190" height="50" rx="5" fill="#1E1E2E"/>
    <rect x="500" y="25" width="190" height="50" rx="5" fill="none" stroke="url(#g3)" stroke-width="1.5"/>
    <rect x="500" y="25" width="190" height="16" rx="5" fill="#313244" opacity="0.6"/>
    <rect x="516" y="44" width="100" height="5" rx="2" fill="#45475A" opacity="0.5"/>
    <rect x="516" y="53" width="70" height="5" rx="2" fill="#45475A" opacity="0.3"/>
  </g>

  <!-- Win 4 -->
  <g filter="url(#sh)">
    <animateTransform attributeName="transform" type="translate"
      values="130 55; 130 55; 0 0; 0 0; 0 0"
      keyTimes="0; 0.2; 0.6; 0.9; 1"
      dur="5s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <rect x="720" y="25" width="190" height="50" rx="5" fill="#1E1E2E"/>
    <rect x="720" y="25" width="190" height="50" rx="5" fill="none" stroke="url(#g4)" stroke-width="1.5"/>
    <rect x="720" y="25" width="190" height="16" rx="5" fill="#313244" opacity="0.6"/>
    <rect x="736" y="44" width="50" height="5" rx="2" fill="#45475A" opacity="0.5"/>
    <rect x="736" y="53" width="90" height="5" rx="2" fill="#45475A" opacity="0.3"/>
  </g>

  <!-- "TILE · 4" label — renders ON TOP of windows, fades out as tiling happens -->
  <g text-anchor="middle" filter="url(#gl)">
    <animate attributeName="opacity" values="0.9;0.9;0.9;0;0;0;0" keyTimes="0;0.1;0.35;0.5;0.65;0.8;1" dur="5s" repeatCount="indefinite"/>
    <rect x="420" y="48" width="160" height="38" rx="19" fill="#1E1E2E" stroke="#CBA6F7" stroke-width="1.5"/>
    <text x="500" y="74" fill="url(#countGrad)" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TILE · 4</text>
  </g>

  <!-- Grid gap flash on settle -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.35;0.35;0;0" keyTimes="0;0.45;0.55;0.6;0.85;0.95;1" dur="5s" repeatCount="indefinite"/>
    <line x1="260" y1="22" x2="260" y2="78" stroke="#CBA6F7" stroke-width="0.5" stroke-dasharray="3 6"/>
    <line x1="490" y1="22" x2="490" y2="78" stroke="#CBA6F7" stroke-width="0.5" stroke-dasharray="3 6"/>
    <line x1="710" y1="22" x2="710" y2="78" stroke="#CBA6F7" stroke-width="0.5" stroke-dasharray="3 6"/>
  </g>
</svg>